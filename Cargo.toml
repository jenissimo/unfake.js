[workspace]
resolver = "2"
members = [
    "crates/unfake-core",
    "crates/unfake-cli",
    "crates/unfake-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/unfake-js/unfake.js"

[workspace.dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
